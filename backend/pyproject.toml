[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beatbridge-backend"
version = "0.1.0"
description = "BeatBridge backend. Audio analysis pipeline that returns Chart JSON."
authors = [{ name = "Patrick Chung" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "scipy>=1.13",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "jsonschema>=4.22",
]
ytdlp = ["yt-dlp>=2024.5.27", "imageio-ffmpeg>=0.5.0"]
demucs = ["demucs>=4.0.1"]
# Phase 1 of docs/ML_PLAN.md: Beat This! beat + downbeat detector. MIT
# licensed, weights tens of MB. Pulls torch as a transitive dep so the
# install is heavy; only required for USE_BEAT_THIS=1.
ml = ["beat-this>=0.1.0", "torch>=2.0"]
# Phase 3 of docs/ML_PLAN.md: MERT audio embeddings for section
# detection. CC-BY-NC weights (95M variant ~380MB); requires HuggingFace
# transformers. Only required for USE_MERT=1.
mert = ["transformers>=4.36", "huggingface-hub>=0.20"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
